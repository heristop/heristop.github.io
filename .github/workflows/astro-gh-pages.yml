name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [master]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      # Explicit steps rather than withastro/action: rehype-mermaid renders ```mermaid fences to SVG at
      # build time by driving Playwright, so the build needs a browser binary installed BEFORE it runs.
      # The action does install+build atomically, leaving no window for that — and running our own
      # install first made the action's nested setup-node fail cache path validation in its post step,
      # failing the job after a green build and skipping the deploy. Doing it by hand is less magic and
      # one less moving part; the action only ever wrapped these five steps.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the Chromium build mermaid renders with
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
        env:
          # Repository variables, not secrets: these ship in every page by design. Left unset, the
          # build stays on Google Analytics — which is what the site runs today. Setting both
          # switches the deployed site to Umami and takes the cookie bar off it.
          UMAMI_SRC: ${{ vars.UMAMI_SRC }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          UMAMI_HOST_URL: ${{ vars.UMAMI_HOST_URL }}
      - name: Upload the site output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
