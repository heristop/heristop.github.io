name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [master]
  # The Path of Stones garden is grown from the last 100 days of GitHub activity, so it
  # goes stale between posts. A daily rebuild keeps it tracking the work.
  # Note: GitHub disables scheduled workflows on repos with 60 days of no activity.
  schedule:
    - cron: "0 5 * * *"
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      # Explicit steps rather than withastro/action: rehype-mermaid renders ```mermaid fences to SVG at
      # build time by driving Playwright, so the build needs a browser binary installed BEFORE it runs.
      # The action does install+build atomically, leaving no window for that — and running our own
      # install first made the action's nested setup-node fail cache path validation in its post step,
      # failing the job after a green build and skipping the deploy. Doing it by hand is less magic and
      # one less moving part; the action only ever wrapped these five steps.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the Chromium build mermaid renders with
        run: pnpm exec playwright install --with-deps chromium
      # Grows the Path of Stones garden from the last 100 days of activity. Never fails
      # the build: on any API error it logs a warning, leaves the committed
      # src/data/github-garden.json alone, and exits 0.
      #
      # The result is deliberately NOT committed back to master. A push from this
      # workflow would re-trigger this workflow — an auto-commit here is an infinite
      # loop. The committed JSON is the offline/dev fallback and is refreshed by hand
      # with `pnpm run fetch:github`; if auto-commit is ever wanted it needs a
      # paths-ignore or [skip ci] guard.
      - name: Fetch the GitHub activity the garden is grown from
        run: pnpm run fetch:github
        env:
          # Unlocks the GraphQL contribution calendar, which covers the full 100-day
          # window. Without it the script falls back to public events, ~90 days.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm run build
        env:
          # A repository variable, not a secret: the token ships in every page by design. Left
          # unset, the site loads no analytics tag at all — which is what makes taking the
          # configuration away the way to switch measurement off.
          CLOUDFLARE_TOKEN: ${{ vars.CLOUDFLARE_TOKEN }}
      - name: Upload the site output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
