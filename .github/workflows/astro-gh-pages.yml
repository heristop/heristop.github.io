name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Refresh the last fourteen completed UTC days of GitHub activity daily.
  # Note: GitHub disables scheduled workflows on repos with 60 days of no activity.
  schedule:
    - cron: "0 5 * * *"
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Read the pinned private garden revision
        id: garden
        shell: bash
        run: |
          revision=$(git rev-parse HEAD:packages/path-of-stones)
          test "$(git ls-tree HEAD packages/path-of-stones | cut -d ' ' -f1)" = "160000"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout the private garden
        uses: actions/checkout@v4
        with:
          repository: heristop/zazen-garden
          ref: ${{ steps.garden.outputs.revision }}
          path: packages/path-of-stones
          ssh-key: ${{ secrets.GARDEN_DEPLOY_KEY }}
          persist-credentials: false

      # Explicit steps rather than withastro/action: rehype-mermaid renders ```mermaid fences to SVG at
      # build time by driving Playwright, so the build needs a browser binary installed BEFORE it runs.
      # The action does install+build atomically, leaving no window for that — and running our own
      # install first made the action's nested setup-node fail cache path validation in its post step,
      # failing the job after a green build and skipping the deploy. Doing it by hand is less magic and
      # one less moving part; the action only ever wrapped these five steps.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check GitHub snapshot ingestion
        run: pnpm --filter @zazencode/path-of-stones test tests/scripts/github-garden.test.ts
      # On API failure keep the saved snapshot and expose its stale status in the UI.
      # Refresh before simulations so the board being deployed is the one tested.
      - name: Fetch the GitHub activity the garden is grown from
        run: pnpm run fetch:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check garden tests, simulations and coverage
        run: pnpm test:garden:coverage
      - name: Install the Chromium build mermaid renders with
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build
        env:
          # A repository variable, not a secret: the token ships in every page by design. Left
          # unset, the site loads no analytics tag at all — which is what makes taking the
          # configuration away the way to switch measurement off.
          CLOUDFLARE_TOKEN: ${{ vars.CLOUDFLARE_TOKEN }}
      - name: Upload the site output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
